name: Autonomous YouTube Channel Factory

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-factory-main
  cancel-in-progress: false

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
      - name: Install Python packages and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Restore YouTube OAuth credentials
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_SECRETS" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRETS" > client_secrets.json
          else
            printf '{}' > client_secrets.json
          fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          else
            printf '{}' > token.json
          fi
      - name: Analyze performance and generate follow-up Shorts
        id: analyze
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
          GITHUB_ACTIONS: "true"
        run: |
          python analytics_loop.py
      - name: Render and schedule Shorts
        id: render
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
          GITHUB_ACTIONS: "true"
        run: |
          python master_pipeline.py --publish
      - name: Compile and schedule weekly 16:9 video
        id: compile
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
          GITHUB_ACTIONS: "true"
        run: |
          python compile_weekly.py --publish
      - name: Commit queue updates
        id: commit
        run: |
          git config user.name "Shorts Bot"
          git config user.email "actions@github.com"
          git add videos.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: weekly batch scheduled [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Send Telegram pipeline alert
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIPELINE_FAILED: ${{ steps.analyze.outcome == 'failure' || steps.render.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.commit.outcome == 'failure' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/scripts/notify_telegram.py
